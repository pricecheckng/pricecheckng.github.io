name: Deploy pdf-tutor function

# Deploys the Supabase Edge Function whenever its code changes on main.
# One-time setup: add the repo secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/pdf-tutor/**"
      - ".github/workflows/deploy-pdf-tutor.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pdf-tutor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "### The SUPABASE_ACCESS_TOKEN secret is empty or missing. Add it under Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          set +e
          out=$(supabase functions deploy pdf-tutor --project-ref lbkpdepqymfjgmoouafv --no-verify-jwt --use-api 2>&1)
          code=$?
          echo "$out"
          {
            echo "### Deploy result (exit code $code)"
            echo '```'
            echo "$out" | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
