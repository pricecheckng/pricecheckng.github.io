name: Site library
on:
  workflow_dispatch:
  schedule:
    - cron: "40 4 * * *"
  push:
    branches: [main]
    paths: ["*.html"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the site library
        run: node scripts/gen-site-library.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add site-library.json
          git diff --cached --quiet || git commit -m "Update site library"
          git pull --rebase -q || true
          git push
