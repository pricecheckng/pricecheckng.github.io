name: Inspect database structure

# Read-only: lists table and column NAMES (no user data), extension names and cron job names.
# Long token-like strings are hidden. Result is saved to db-structure.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/lbkpdepqymfjgmoouafv/database/query" -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data "$(jq -n --arg q "$1" '{query:$q}')" ; echo; }
          {
            echo "## schedules (no text, no user ids)"; q "select status, freq, model, channels, run_at, last_run_at, last_status, created_at from public.ai_schedules order by created_at desc limit 10"
            echo "## cron runs"; q "select d.status, left(d.return_message,200) as msg, d.start_time from cron.job_run_details d join cron.job j on j.jobid=d.jobid where j.jobname='ai-schedules' order by d.start_time desc limit 5"
            echo "## ai notifications (no text)"; q "select created_at, sent_at, telegram_sent_at, length(body) as len from public.notifications where title like E'\\U0001F916%' order by created_at desc limit 5"
            echo "## function deployed? (401 = yes, 404 = no)"; curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "x-sched-secret: wrong" -H "Content-Type: application/json" -d '{}' "https://lbkpdepqymfjgmoouafv.supabase.co/functions/v1/pcn-sched"
            echo "## run function by hand via db"; q "select private.run_ai_schedules()"
          } 2>&1 | sed -E 's/[A-Za-z0-9_.:-]{36,}/<hidden>/g' > db-structure.txt
          wc -c db-structure.txt
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db-structure.txt
          git commit -m "Inspect database structure" || exit 0
          git pull --rebase -q
          git push
