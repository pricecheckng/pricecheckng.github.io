name: Inspect database structure

# Read-only: lists table and column NAMES (no user data), extension names and cron job names.
# Long token-like strings are hidden. Result is saved to db-structure.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/lbkpdepqymfjgmoouafv/database/query" -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data "$(jq -n --arg q "$1" '{query:$q}')" ; echo; }
          {
            echo "## binance"; q "select left(content,500) r from extensions.http_post('https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search', '{\"fiat\":\"NGN\",\"page\":1,\"rows\":3,\"tradeType\":\"BUY\",\"asset\":\"USDT\",\"countries\":[],\"proMerchantAds\":false,\"shieldMerchantAds\":false,\"publisherType\":null,\"payTypes\":[],\"classifies\":[\"mass\",\"profession\"]}', 'application/json')"
            echo "## kucoin"; q "select status, left(content,500) r from extensions.http_get('https://www.kucoin.com/_api/otc/ad/list?currency=USDT&side=SELL&legal=NGN&page=1&pageSize=3&status=PUTUP&lang=en_US')"
            echo "## mexc ghs"; q "select left(content,300) r from extensions.http_get('https://p2p.mexc.com/api/market?allowTrade=false&blockTrade=false&coinId=128f589271cb4951b03e71e6323eb7be&countryCode=&currency=GHS&follow=false&haveTrade=false&page=1&payMethod=&tradeType=SELL')"
          } 2>&1 | sed -E 's/[A-Za-z0-9_.:-]{40,}/<hidden>/g' > db-structure.txt
          wc -c db-structure.txt
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db-structure.txt
          git commit -m "Inspect database structure" || exit 0
          git pull --rebase -q
          git push
