name: Inspect database structure

# Read-only: lists table and column NAMES (no user data), extension names and cron job names.
# Long token-like strings are hidden. Result is saved to db-structure.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/lbkpdepqymfjgmoouafv/database/query" -H "Authorization: Bearer $T" -H "Content-Type: application/json" --data "$(jq -n --arg q "$1" '{query:$q}')" ; echo; }
          {
            echo "## call_send_push"; q "select left(pg_get_functiondef(p.oid),2500) as def from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='private' and p.proname='call_send_push'"
            echo "## send_daily_summaries"; q "select left(pg_get_functiondef(p.oid),3000) as def from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='private' and p.proname='send_daily_summaries'"
            echo "## vault secret names"; q "select name from vault.secrets order by 1"
            echo "## notifications policies"; q "select policyname, cmd from pg_policies where tablename in ('notifications','ai_feedback')"
          } 2>&1 | sed -E 's/[A-Za-z0-9_.:-]{36,}/<hidden>/g' > db-structure.txt
          wc -c db-structure.txt
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db-structure.txt
          git commit -m "Inspect database structure" || exit 0
          git pull --rebase -q
          git push
