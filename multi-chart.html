  a = [...a.filter(p => favs.includes(p.s)), ...a.filter(p => !favs.includes(p.s))].slice(0, 300);
  box.innerHTML = a.length ? '' : '<div class="empty">No pair found on ' + EXN[pkEx] + '.</div>';
  a.forEach(p => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<span class="st${favs.includes(p.s) ? ' on' : ''}">${favs.includes(p.s) ? '&#9733;' : '&#9734;'}</span><span class="ico"></span><span class="nm">${p.s}/${quoteOf(pkEx)}<small>${String(p.name).replace(/</g, '')}</small></span><span class="tp">spot</span>`;
    setIco(r.querySelector('.ico'), p.s);
    r.querySelector('.st').onclick = e => { e.stopPropagation(); favs = favs.includes(p.s) ? favs.filter(x => x !== p.s) : [p.s, ...favs]; ss2('pcn_chart_favs', favs); renderList(); };
    r.onclick = () => { G('sheetBg').classList.remove('on'); if (pk) pk.setPair(p.s, pkEx); };
    box.appendChild(r);
  });
}
async function showEx(ex) { pkEx = ex; paintTabs(); renderList(); if (!pairsC[ex]) { try { await loadPairs(ex); } catch (_) { pairsC[ex] = []; } if (pkEx === ex) { paintTabs(); renderList(); } } }

G('tabC').onclick = () => { ptab = 'crypto'; paintTabs(); renderList(); };
G('tabT').onclick = () => { ptab = 'tradfi'; tfSub = 'all'; paintTabs(); renderList(); };
G('shBack').onclick = () => G('sheetBg').classList.remove('on'); G('shQ').oninput = renderList;
document.querySelectorAll('#sheetBg .exs [data-ex]').forEach(b => { if (!EXN[b.dataset.ex]) b.remove(); else b.onclick = () => showEx(b.dataset.ex); });
// small dropdown menu used by exchange / timeframe / chart type buttons
const pm = G('pmenu'); document.addEventListener('click', () => pm.classList.remove('on'));
function popMenu(btn, items, cur, pick) {
  pm.innerHTML = items.map(x => x === '-' ? '<hr>' : `<button type="button" data-v="${x[0]}" class="${x[0] === cur ? 'on' : ''}">${x[2] || ''}${x[1]}</button>`).join('');
  pm.querySelectorAll('[data-v]').forEach(b => b.onclick = e => { e.stopPropagation(); pm.classList.remove('on'); pick(b.dataset.v); });
  const r = btn.getBoundingClientRect(); pm.classList.add('on'); pm.style.left = Math.max(6, Math.min(r.left, innerWidth - pm.offsetWidth - 6)) + 'px'; pm.style.top = (r.bottom + 4) + 'px';
}
const CTL = [['candles', 'Candles'], ['hollow', 'Hollow candles'], ['bars', 'Bars'], '-', ['line', 'Line'], ['linem', 'Line with markers'], ['step', 'Step line'], '-', ['area', 'Area'], ['baseline', 'Baseline'], '-', ['columns', 'Columns'], ['highlow', 'High-low'], ['heikin', 'Heikin Ashi']];
const TFL = [['15m', '15 minutes'], ['1h', '1 hour'], ['4h', '4 hours'], ['1d', '1 day'], ['1w', '1 week']];
const TFSH = { '15m': '15m', '1h': '1h', '4h': '4h', '1d': 'D', '1w': 'W' };
function applyAll(p) { try { p.chart.setHidden(eyeOff); p.chart.setLocked(locked); p.chart.setMagnet(magnetOn); if (p.chart.setStay) p.chart.setStay(stayOn); p.chart.setCursor(curMode); } catch (_) {} }
function paintG() {
  if (!cur) return; const P = cur.P, el = cur.el;
  G('gpair').innerHTML = '<span class="ico"></span><span>' + P.s + '/' + quoteOf(P.e) + '</span><small>▾</small>'; setIco(G('gpair').querySelector('.ico'), P.s);
  G('gex').innerHTML = EXN[P.e] + ' <small>▾</small>'; G('gtf').innerHTML = (TFSH[P.i] || P.i) + ' <small>▾</small>';
  G('gct').innerHTML = el.querySelector('.ctb').innerHTML; G('gub').innerHTML = ICONS.undo; G('grb').innerHTML = ICONS.redo; G('gfs').innerHTML = ICONS.fs; G('gsn').innerHTML = ICONS.cam;
  G('gub').classList.toggle('dis', !cur.chart.canUndo()); G('grb').classList.toggle('dis', !cur.chart.canRedo());
  G('gsel').textContent = cfg.n > 1 ? 'Chart ' + (panes.indexOf(cur) + 1) + ' selected' : '';
}
const viaCur = (cls, id) => G(id).onclick = e => { e.stopPropagation(); if (!cur) return; const b = cur.el.querySelector(cls); b.onclick({ stopPropagation() {}, currentTarget: G(id) }); };
viaCur('.pairb', 'gpair'); viaCur('.exb', 'gex'); viaCur('.tfb2', 'gtf'); viaCur('.ctb', 'gct'); viaCur('.ub', 'gub'); viaCur('.rb', 'grb'); viaCur('.fsb', 'gfs'); viaCur('.snb', 'gsn');
function setCur(p) { cur = p; panes.forEach(x => x.el.classList.toggle('cur', x === p)); paintHist(); paintTool(); paintG(); }
document.addEventListener('touchstart', e => { panes.forEach(p => { if (p.el.classList.contains('act') && !p.el.contains(e.target)) p.el.classList.remove('act'); }); }, { passive: true });
for (let k = 0; k < 8; k++) { const p = makePane(k); panes.push(p); grid.appendChild(p.el); }

  const L = LAYN[cfg.lay] ? cfg.lay : 'g4'; cfg.n = LAYN[L];
  grid.className = 'grid l' + L;
  let w = 0;
  panes.forEach((p, k) => { p.on = k < cfg.n; p.el.style.display = p.on ? '' : 'none'; if (p.on && !p.did) { p.did = true; setTimeout(() => p.load(true), 300 * w++); } });
  document.querySelectorAll('#lgrid button').forEach(b => b.classList.toggle('on', b.dataset.l === L));

lp.addEventListener('click', e => e.stopPropagation()); document.addEventListener('click', () => lp.classList.remove('open'));

$('#sSym').checked = !!cfg.sym; $('#sSym').onchange = e => { cfg.sym = e.target.checked; save(); if (cfg.sym) { const v = cfg.panes[0].s; panes.forEach(p => { if (p.P.s !== v) { p.P.s = v; p.el.querySelector('.sy').value = v; p.sig = ''; p.loadD(); if (p.on) p.load(true); } }); } };
$('#sInt').checked = !!cfg.int; $('#sInt').onchange = e => { cfg.int = e.target.checked; save(); if (cfg.int) { const v = cfg.panes[0].i; panes.forEach(p => { if (p.P.i !== v) { p.P.i = v; p.el.querySelectorAll('.tfs button').forEach(x => x.classList.toggle('on', x.dataset.i === v)); p.sig = ''; if (p.on) p.load(true); } }); } };

if (window.innerWidth < 900 && !localStorage.getItem('pcn_multi')) cfg.lay = 'c2';
layout();
setCur(panes[0]);
setInterval(() => { if (!document.hidden) panes.forEach(p => { if (p.on && p.did) p.load(false); }); }, 6000);
