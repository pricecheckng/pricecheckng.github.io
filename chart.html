<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chart | PriceCheck NG</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0b120e; --panel:#101a15; --line:#1e2d25; --txt:#e8f1ec; --mut:#8aa396; --up:#16c784; --dn:#ea3943; --acc:#12a150; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  .top { display:flex; align-items:center; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  .back { width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; color:var(--txt); text-decoration:none; background:#16241d; }
  .sym { display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; }
  .sym input { width:78px; background:#16241d; border:1px solid var(--line); border-radius:10px; color:var(--txt); font:inherit; padding:7px 9px; text-transform:uppercase; }
  .sym small { color:var(--mut); font-weight:600; font-size:12px; }
  .tfs { display:flex; gap:0; margin-left:auto; }
  .tf { background:none; border:0; color:var(--mut); font:inherit; font-size:12px; font-weight:700; padding:7px 6px; border-radius:9px; cursor:pointer; }
  .tf.on { background:#16241d; color:var(--txt); }
  .info { padding:8px 12px 2px; font-size:13px; white-space:nowrap; overflow:hidden; display:flex; gap:12px; flex-wrap:wrap; align-items:baseline; }
  .info b { font-size:20px; } #px.hv { font-size:12px; font-weight:700; } .info .mut { color:var(--mut); }
  .leg { padding:0 12px 4px; font-size:11px; color:var(--mut); display:flex; gap:12px; }
  .leg i { display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  #main { flex:1 1 62%; min-height:0; position:relative; margin-left:44px; }
  #rsiWrap { flex:0 0 22%; min-height:90px; position:relative; border-top:1px solid var(--line); margin-left:44px; }
  #dtools { position:absolute; left:-44px; top:0; bottom:0; width:44px; z-index:4; display:flex; flex-direction:column; align-items:center; gap:2px; padding-top:4px; overflow-y:auto; scrollbar-width:none; border-right:1px solid var(--line); }
  #dtools::-webkit-scrollbar { display:none; }
  #dtools button { flex:none; width:38px; height:38px; border:0; border-radius:10px; background:none; color:var(--mut); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  #dtools button.on { background:#1b2e24; color:var(--acc2,#16c784); } #dtools button.dis { opacity:.35; }
  #dFav { display:contents; }
  .st { margin-left:auto; font-style:normal; font-size:20px; line-height:1; color:var(--mut); padding:4px 4px 4px 12px; } .st.on { color:#f5a524; }
  #dtools hr { width:24px; border:0; border-top:1px solid var(--line); margin:4px 0; }
  #curBg { position:fixed; inset:0; z-index:19; display:none; background:rgba(0,0,0,.45); } #curBg.on { display:block; }
  #curSheet { position:absolute; left:0; right:0; bottom:0; background:#101a15; border-top:1px solid var(--line); border-radius:16px 16px 0 0; padding:8px 0 14px; }
  #curSheet button { display:flex; align-items:center; gap:16px; width:100%; background:none; border:0; color:var(--txt); font:inherit; font-size:16px; padding:14px 18px; cursor:pointer; text-align:left; } #curSheet button.on { background:#1b2e24; color:var(--acc2,#16c784); }
  #fibBg { position:fixed; inset:0; z-index:19; display:none; background:rgba(0,0,0,.45); } #fibBg.on { display:block; }
  #fibSheet { position:absolute; left:0; right:0; bottom:0; background:#101a15; border-top:1px solid var(--line); border-radius:16px 16px 0 0; padding:6px 0 14px; }
  #fibSheet .lnh { font-size:11px; letter-spacing:.08em; color:var(--mut); font-weight:700; padding:12px 18px 6px; }
  #fibSheet button { display:flex; align-items:center; gap:16px; width:100%; background:none; border:0; color:var(--txt); font:inherit; font-size:16px; padding:13px 18px; cursor:pointer; text-align:left; } #fibSheet button.on { background:#1b2e24; color:var(--acc2,#16c784); }
  #lnBg { position:fixed; inset:0; z-index:19; display:none; background:rgba(0,0,0,.45); } #lnBg.on { display:block; }
  #lnSheet { position:absolute; left:0; right:0; bottom:0; background:#101a15; border-top:1px solid var(--line); border-radius:16px 16px 0 0; padding:6px 0 14px; max-height:70%; overflow-y:auto; }
  #lnSheet .lnh { font-size:11px; letter-spacing:.08em; color:var(--mut); font-weight:700; padding:12px 18px 6px; }
  #lnSheet button { display:flex; align-items:center; gap:16px; width:100%; background:none; border:0; color:var(--txt); font:inherit; font-size:16px; padding:13px 18px; cursor:pointer; text-align:left; } #lnSheet button.on { background:#1b2e24; color:var(--acc2,#16c784); } #lnSheet button svg { flex:none; }
  #dhint { position:absolute; left:50%; top:8px; transform:translateX(-50%); z-index:5; background:rgba(11,18,14,.92); border:1px solid var(--line); color:var(--txt); font-size:12px; font-weight:600; padding:6px 12px; border-radius:14px; display:none; white-space:nowrap; pointer-events:none; } #dhint.on { display:block; }
  #rsiWrap .lbl { position:absolute; left:8px; top:4px; z-index:3; font-size:11px; color:var(--mut); font-weight:700; }
  #main > div:not(#dtools):not(#dhint), #rsiWrap > div.c { position:absolute; inset:0; }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--mut); font-size:14px; z-index:5; background:var(--bg); }
  .foot { padding:6px 12px calc(6px + env(safe-area-inset-bottom)); font-size:11px; color:var(--mut); border-top:1px solid var(--line); display:flex; justify-content:space-between; }

  .pair { display:flex; align-items:center; gap:8px; background:#16241d; border:1px solid var(--line); border-radius:12px; color:var(--txt); font:inherit; font-weight:800; font-size:15px; padding:7px 10px; cursor:pointer; }
  .pair img, .ico { width:22px; height:22px; border-radius:50%; background:#243a2f; object-fit:cover; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--mut); flex:none; }
  .pair { white-space:nowrap; flex:none; padding:6px 9px; font-size:14px; gap:7px; } .pair small { color:var(--mut); font-weight:600; font-size:10px; white-space:nowrap; }
  .live { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--mut); }
  .live i { width:7px; height:7px; border-radius:50%; background:#5b6b62; } .live.on { color:var(--up); } .live.on i { background:var(--up); animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(22,199,132,.6)} 100%{box-shadow:0 0 0 7px rgba(22,199,132,0)} }
  #sheetBg { position:fixed; inset:0; background:var(--bg); z-index:20; display:none; flex-direction:column; }
  #sheetBg.on { display:flex; }
  .sh-top { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .sh-top input { flex:1; background:#16241d; border:1px solid var(--acc); border-radius:12px; color:var(--txt); font:inherit; padding:11px 12px; outline:none; }
  .tabs { display:flex; gap:20px; padding:0 16px; border-bottom:1px solid var(--line); }
  .tabs button, .exs button { background:none; border:0; color:var(--mut); font:inherit; font-weight:700; padding:12px 0; cursor:pointer; border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--txt); border-color:var(--acc); }
  .exs { display:flex; gap:18px; padding:0 16px; border-bottom:1px solid var(--line); overflow-x:auto; }
  .exs button { font-size:14px; white-space:nowrap; } .exs button.on { color:var(--txt); border-color:var(--acc); }
  .exs button.soon { opacity:.45; cursor:default; } .exs sup { font-size:9px; margin-left:3px; color:var(--mut); }
  #plist { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row .nm { flex:1; font-weight:700; } .row .nm small { display:block; color:var(--mut); font-weight:500; font-size:12px; }
  .row .tp { color:var(--mut); font-size:12px; } .row .st { color:var(--mut); font-size:20px; width:24px; text-align:center; } .row .st.on { color:#f5a524; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid var(--line); min-height:44px; }
  .topt { display:flex; justify-content:space-between; padding:14px 12px; border-radius:10px; font-weight:600; cursor:pointer; } .topt.on { background:#1b2e24; } .topt.off { opacity:.45; cursor:default; } .topt em { font-style:normal; color:var(--mut); }
  .empty { padding:30px 16px; color:var(--mut); text-align:center; }

  @keyframes lfu{0%,55%{color:#16c784}100%{color:inherit}} @keyframes lfd{0%,55%{color:#ea3943}100%{color:inherit}}
  .lf-u{animation:lfu 1.1s ease-out} .lf-d{animation:lfd 1.1s ease-out}
  .dd { position:relative; flex:none; }
  .ddb { display:flex; align-items:center; gap:5px; background:none; border:0; color:var(--mut); font:inherit; font-size:13px; font-weight:700; padding:8px 6px; cursor:pointer; white-space:nowrap; }
  .ddb.tfb { color:var(--txt); }
  .ddm { display:none; position:absolute; top:100%; left:0; z-index:15; min-width:150px; background:#14211a; border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .ddm.r { left:auto; right:0; } .ddm.on { display:block; }
  .ddm button { display:flex; width:100%; justify-content:space-between; align-items:center; gap:14px; background:none; border:0; color:var(--txt); font:inherit; font-size:14px; font-weight:600; padding:10px 10px; border-radius:8px; cursor:pointer; text-align:left; }
  .ddm button.on { background:#1b2e24; } .ddm button:disabled { color:var(--mut); opacity:.5; cursor:default; } .ddm em { font-style:normal; font-size:10px; color:var(--mut); }

  .view { flex:1; min-height:0; flex-direction:column; } .pg { overflow-y:auto; }
  .pgh { padding:16px; font-size:20px; font-weight:800; }
  .tabbar { display:flex; border-top:1px solid var(--line); background:var(--panel); padding-bottom:env(safe-area-inset-bottom); }
  .tb { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:0; color:var(--mut); font:inherit; font-size:11px; font-weight:700; padding:9px 0 8px; cursor:pointer; }
  .tb.on { color:var(--txt); } .tb.on svg { color:var(--acc); }
  .grp { padding:14px 16px 6px; color:var(--mut); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
  .set { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  .set b { color:var(--mut); font-weight:600; font-size:13px; } .set select { background:#16241d; color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px; font:inherit; }
  .set input[type=checkbox] { appearance:none; width:46px; height:26px; border-radius:13px; background:#2a3b32; position:relative; transition:.15s; flex:none; }
  .set input[type=checkbox]::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.15s; }
  .set input[type=checkbox]:checked { background:var(--acc); } .set input[type=checkbox]:checked::after { left:23px; }
  .wrow { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .wrow .nm { flex:1; font-weight:700; } .wrow .nm small { display:block; color:var(--mut); font-weight:500; font-size:12px; }
  .wrow .pr { text-align:right; font-weight:700; } .wrow .pr small { display:block; font-size:12px; font-weight:700; }
  .addb { margin:18px 16px; display:block; width:calc(100% - 32px); background:var(--acc); color:#fff; border:0; border-radius:12px; padding:13px; font:inherit; font-weight:800; cursor:pointer; }

  #agent { flex:0 0 auto; display:flex; flex-direction:column; background:var(--panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0; position:relative; }
  #agent.open { height:var(--ag-h, 46%); }
  #agent.full { position:fixed; left:8px; right:8px; top:64px; bottom:calc(66px + env(safe-area-inset-bottom)); height:auto; z-index:15; border:1px solid var(--line); border-radius:16px; box-shadow:0 0 0 100vmax rgba(0,0,0,.55), 0 12px 40px rgba(0,0,0,.6); }
  #agent.full .aghandle { display:none; } #agent.full .aghead { padding-top:12px; }
  #vChart.agopen #rsiWrap { display:none; }
  .aghandle { height:18px; display:flex; align-items:center; justify-content:center; cursor:ns-resize; touch-action:none; flex:none; } .aghandle i { width:44px; height:4px; border-radius:2px; background:#3a5446; }
  .aghead { display:none; align-items:center; justify-content:space-between; padding:2px 14px 8px; font-weight:800; font-size:14px; flex:none; }
  #agent.open .aghead { display:flex; }
  .aghead button { background:none; border:0; color:var(--mut); font:inherit; font-size:12px; font-weight:700; padding:4px 6px; cursor:pointer; }
  #agMsgs { display:none; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 8px; }
  #agent.open #agMsgs { display:block; }
  .ag-u { margin:8px 0 8px auto; max-width:85%; width:fit-content; background:var(--acc); color:#fff; padding:8px 12px; border-radius:14px 14px 4px 14px; font-size:14px; }
  .ag-a { margin:8px 0; font-size:14px; line-height:1.5; } .ag-a p { margin:0 0 8px; } .ag-a ul { margin:0 0 8px; padding-left:18px; } .ag-a h3 { font-size:15px; margin:10px 0 4px; }
  .ag-st { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; } .ag-st span { font-size:11px; color:var(--mut); background:#16241d; border:1px solid var(--line); border-radius:8px; padding:3px 8px; }
  .ag-note { font-size:11px; color:var(--mut); margin-top:6px; }
  .ag-chips { display:flex; flex-wrap:wrap; gap:8px; padding:6px 0 10px; } .ag-chips button { background:#16241d; border:1px solid var(--line); color:var(--txt); border-radius:16px; font:inherit; font-size:13px; padding:8px 12px; cursor:pointer; }
  .ag-grp { font-size:12px; color:var(--mut); margin:10px 0 6px; font-weight:700; }
  .ag-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; } .ag-row::-webkit-scrollbar { display:none; }
  .ag-row button { flex:none; white-space:nowrap; background:#16241d; border:1px solid var(--line); color:var(--txt); border-radius:18px; font:inherit; font-size:13px; padding:9px 14px; cursor:pointer; }
  .hv-top { display:flex; align-items:center; justify-content:space-between; padding:4px 0 10px; font-weight:800; } .hv-top button { background:none; border:0; color:var(--acc2,#16c784); font:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:4px 0; }
  .hv-item { display:block; width:100%; text-align:left; background:#16241d; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; color:var(--txt); font:inherit; cursor:pointer; }
  .hv-item .m { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--mut); margin-bottom:4px; } .hv-item .q { font-size:14px; font-weight:600; }
  .hv-del { background:none; border:0; color:var(--mut); padding:2px 4px; cursor:pointer; }
  .ag-steps { margin:6px 0 10px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .ags-h { display:flex; align-items:center; gap:8px; background:none; border:0; color:var(--mut); font:inherit; font-size:13px; padding:4px 0; cursor:pointer; } .ags-h .chev { display:inline-block; transition:transform .15s; transform:rotate(-90deg); } .ag-steps.open .chev { transform:none; }
  .ags-b { display:none; background:#16241d; border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin-top:4px; } .ag-steps.open .ags-b { display:block; }
  .ags-r { display:flex; gap:12px; position:relative; padding:8px 0; } .ags-r + .ags-r::before { content:''; position:absolute; left:13px; top:-14px; height:24px; border-left:1px solid #2c4337; }
  .ags-i { flex:none; width:28px; height:28px; border-radius:50%; border:1px solid #2c4337; background:#0f1a14; display:inline-flex; align-items:center; justify-content:center; color:var(--acc2,#16c784); font-style:normal; z-index:1; }
  .ags-r > div { flex:1; min-width:0; } .ags-l { display:flex; justify-content:space-between; gap:8px; font-size:13px; } .ags-l b { font-weight:700; } .ags-l .d { color:var(--mut); font-size:12px; text-align:right; } .ags-s { color:var(--mut); font-size:12px; margin-top:2px; }
  .ag-dots span { display:inline-block; width:6px; height:6px; margin-right:4px; border-radius:50%; background:var(--mut); animation:agb 1s infinite; } .ag-dots span:nth-child(2){animation-delay:.15s} .ag-dots span:nth-child(3){animation-delay:.3s}
  @keyframes agb { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  #agForm { display:flex; align-items:flex-end; gap:8px; padding:4px 12px 10px; flex:none; }
  #agForm .box { flex:1; display:flex; flex-direction:column; background:#16241d; border:1px solid var(--line); border-radius:14px; padding:8px 10px 6px; }
  #agIn { background:none; border:0; outline:0; resize:none; color:var(--txt); font:inherit; font-size:15px; line-height:1.35; max-height:96px; width:100%; }
  .agrow { display:flex; align-items:center; gap:8px; margin-top:4px; }
  #agMode { background:#101a15; border:1px solid var(--line); color:var(--txt); border-radius:10px; font:inherit; font-size:12px; font-weight:700; padding:5px 9px; cursor:pointer; }
  #agSend { margin-left:auto; width:36px; height:36px; border-radius:10px; border:0; background:var(--acc); color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; } #agSend:disabled { opacity:.5; }
  #agUp { width:44px; height:44px; flex:none; border-radius:12px; border:1px solid var(--line); background:#16241d; color:var(--txt); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  #agModeMenu { display:none; position:absolute; left:16px; right:16px; bottom:70px; z-index:12; background:#14211a; border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 10px 30px rgba(0,0,0,.5); } #agModeMenu.on { display:block; }
  #agModeMenu button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--txt); font:inherit; font-size:14px; font-weight:700; padding:9px 10px; border-radius:8px; cursor:pointer; } #agModeMenu button small { display:block; color:var(--mut); font-weight:500; font-size:11px; } #agModeMenu button { position:relative; padding-right:34px; } #agModeMenu button small { font-size:12px; } #agModeMenu button.on { background:#1b2e24; } #agModeMenu button.on::after { content:'\2713'; position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--g,#16c784); font-size:16px; }
</style>

<body>
<div id="app">
  <div class="top">
    <a class="back" href="index.html" aria-label="Back"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3L5 9l6 6"/></svg></a>
    <button class="pair" id="pairBtn" aria-label="Choose pair"><span class="ico" id="pIco">B</span><span id="pTxt">BTC/USDT</span><small>&#9662;</small></button>
    <div class="dd"><button class="ddb" id="exBtn">Binance <span>&#9662;</span></button>
      <div class="ddm" id="exMenu"><button class="on">Binance<em>live</em></button><button disabled>OKX<em>soon</em></button><button disabled>Bybit<em>soon</em></button><button disabled>Aster<em>soon</em></button><button disabled>Bitget<em>soon</em></button><button disabled>Gate<em>soon</em></button><button disabled>MEXC<em>soon</em></button></div></div>
    <div class="dd" style="margin-left:auto"><button class="ddb tfb" id="tfBtn"><span id="tfTxt">4h</span> <span>&#9662;</span></button>
      <div class="ddm r" id="tfMenu"><button class="tf" data-i="15m">15 minutes</button><button class="tf" data-i="1h">1 hour</button><button class="tf on" data-i="4h">4 hours</button><button class="tf" data-i="1d">1 day</button><button class="tf" data-i="1w">1 week</button></div></div>
  </div>
  <div id="vChart" class="view" style="display:flex">
  <div class="info"><b id="px">--</b><span id="chg" class="mut"></span><span class="live" id="live"><i></i><span id="liveT">connecting</span></span></div>
  <div class="leg"><span><i style="background:#f5a524"></i>MA 50</span><span><i style="background:#5b8def"></i>MA 200</span></div>
  <div id="main"><div id="dtools" role="toolbar" aria-label="Drawing tools">
