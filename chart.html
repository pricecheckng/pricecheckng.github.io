<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chart | PriceCheck NG</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0b120e; --panel:#101a15; --line:#1e2d25; --txt:#e8f1ec; --mut:#8aa396; --up:#16c784; --dn:#ea3943; --acc:#12a150; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  .top { display:flex; align-items:center; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  .back { width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; color:var(--txt); text-decoration:none; background:#16241d; }
  .sym { display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; }
  .sym input { width:78px; background:#16241d; border:1px solid var(--line); border-radius:10px; color:var(--txt); font:inherit; padding:7px 9px; text-transform:uppercase; }
  .sym small { color:var(--mut); font-weight:600; font-size:12px; }
  .tfs { display:flex; gap:0; margin-left:auto; }
  .tf { background:none; border:0; color:var(--mut); font:inherit; font-size:12px; font-weight:700; padding:7px 6px; border-radius:9px; cursor:pointer; }
  .tf.on { background:#16241d; color:var(--txt); }
  .info { padding:8px 12px 2px; font-size:13px; white-space:nowrap; overflow:hidden; display:flex; gap:12px; flex-wrap:wrap; align-items:baseline; }
  .info b { font-size:20px; } #px.hv { font-size:12px; font-weight:700; } .info .mut { color:var(--mut); }
  .leg { padding:0 12px 4px; font-size:11px; color:var(--mut); display:flex; gap:12px; }
  .leg i { display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  #main { flex:1 1 62%; min-height:0; position:relative; }
  #rsiWrap { flex:0 0 22%; min-height:90px; position:relative; border-top:1px solid var(--line); }
  #rsiWrap .lbl { position:absolute; left:8px; top:4px; z-index:3; font-size:11px; color:var(--mut); font-weight:700; }
  #main > div, #rsiWrap > div.c { position:absolute; inset:0; }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--mut); font-size:14px; z-index:5; background:var(--bg); }
  .foot { padding:6px 12px calc(6px + env(safe-area-inset-bottom)); font-size:11px; color:var(--mut); border-top:1px solid var(--line); display:flex; justify-content:space-between; }

  .pair { display:flex; align-items:center; gap:8px; background:#16241d; border:1px solid var(--line); border-radius:12px; color:var(--txt); font:inherit; font-weight:800; font-size:15px; padding:7px 10px; cursor:pointer; }
  .pair img, .ico { width:22px; height:22px; border-radius:50%; background:#243a2f; object-fit:cover; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--mut); flex:none; }
  .pair { white-space:nowrap; flex:none; padding:6px 9px; font-size:14px; gap:7px; } .pair small { color:var(--mut); font-weight:600; font-size:10px; white-space:nowrap; }
  .live { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--mut); }
  .live i { width:7px; height:7px; border-radius:50%; background:#5b6b62; } .live.on { color:var(--up); } .live.on i { background:var(--up); animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(22,199,132,.6)} 100%{box-shadow:0 0 0 7px rgba(22,199,132,0)} }
  #sheetBg { position:fixed; inset:0; background:var(--bg); z-index:20; display:none; flex-direction:column; }
  #sheetBg.on { display:flex; }
  .sh-top { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .sh-top input { flex:1; background:#16241d; border:1px solid var(--acc); border-radius:12px; color:var(--txt); font:inherit; padding:11px 12px; outline:none; }
  .tabs { display:flex; gap:20px; padding:0 16px; border-bottom:1px solid var(--line); }
  .tabs button, .exs button { background:none; border:0; color:var(--mut); font:inherit; font-weight:700; padding:12px 0; cursor:pointer; border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--txt); border-color:var(--acc); }
  .exs { display:flex; gap:18px; padding:0 16px; border-bottom:1px solid var(--line); overflow-x:auto; }
  .exs button { font-size:14px; white-space:nowrap; } .exs button.on { color:var(--txt); border-color:var(--acc); }
  .exs button.soon { opacity:.45; cursor:default; } .exs sup { font-size:9px; margin-left:3px; color:var(--mut); }
  #plist { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row .nm { flex:1; font-weight:700; } .row .nm small { display:block; color:var(--mut); font-weight:500; font-size:12px; }
  .row .tp { color:var(--mut); font-size:12px; } .row .st { color:var(--mut); font-size:20px; width:24px; text-align:center; } .row .st.on { color:#f5a524; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid var(--line); min-height:44px; }
  .topt { display:flex; justify-content:space-between; padding:14px 12px; border-radius:10px; font-weight:600; cursor:pointer; } .topt.on { background:#1b2e24; } .topt.off { opacity:.45; cursor:default; } .topt em { font-style:normal; color:var(--mut); }
  .empty { padding:30px 16px; color:var(--mut); text-align:center; }

  @keyframes lfu{0%,55%{color:#16c784}100%{color:inherit}} @keyframes lfd{0%,55%{color:#ea3943}100%{color:inherit}}
  .lf-u{animation:lfu 1.1s ease-out} .lf-d{animation:lfd 1.1s ease-out}
  .dd { position:relative; flex:none; }
  .ddb { display:flex; align-items:center; gap:5px; background:none; border:0; color:var(--mut); font:inherit; font-size:13px; font-weight:700; padding:8px 6px; cursor:pointer; white-space:nowrap; }
  .ddb.tfb { color:var(--txt); }
  .ddm { display:none; position:absolute; top:100%; left:0; z-index:15; min-width:150px; background:#14211a; border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .ddm.r { left:auto; right:0; } .ddm.on { display:block; }
  .ddm button { display:flex; width:100%; justify-content:space-between; align-items:center; gap:14px; background:none; border:0; color:var(--txt); font:inherit; font-size:14px; font-weight:600; padding:10px 10px; border-radius:8px; cursor:pointer; text-align:left; }
  .ddm button.on { background:#1b2e24; } .ddm button:disabled { color:var(--mut); opacity:.5; cursor:default; } .ddm em { font-style:normal; font-size:10px; color:var(--mut); }

  .view { flex:1; min-height:0; flex-direction:column; } .pg { overflow-y:auto; }
  .pgh { padding:16px; font-size:20px; font-weight:800; }
  .tabbar { display:flex; border-top:1px solid var(--line); background:var(--panel); padding-bottom:env(safe-area-inset-bottom); }
  .tb { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:0; color:var(--mut); font:inherit; font-size:11px; font-weight:700; padding:9px 0 8px; cursor:pointer; }
  .tb.on { color:var(--txt); } .tb.on svg { color:var(--acc); }
  .grp { padding:14px 16px 6px; color:var(--mut); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
  .set { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  .set b { color:var(--mut); font-weight:600; font-size:13px; } .set select { background:#16241d; color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:8px; font:inherit; }
  .set input[type=checkbox] { appearance:none; width:46px; height:26px; border-radius:13px; background:#2a3b32; position:relative; transition:.15s; flex:none; }
  .set input[type=checkbox]::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.15s; }
  .set input[type=checkbox]:checked { background:var(--acc); } .set input[type=checkbox]:checked::after { left:23px; }
  .wrow { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .wrow .nm { flex:1; font-weight:700; } .wrow .nm small { display:block; color:var(--mut); font-weight:500; font-size:12px; }
  .wrow .pr { text-align:right; font-weight:700; } .wrow .pr small { display:block; font-size:12px; font-weight:700; }
  .addb { margin:18px 16px; display:block; width:calc(100% - 32px); background:var(--acc); color:#fff; border:0; border-radius:12px; padding:13px; font:inherit; font-weight:800; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a class="back" href="index.html" aria-label="Back"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3L5 9l6 6"/></svg></a>
    <button class="pair" id="pairBtn" aria-label="Choose pair"><span class="ico" id="pIco">B</span><span id="pTxt">BTC/USDT</span><small>&#9662;</small></button>
    <div class="dd"><button class="ddb" id="exBtn">Binance <span>&#9662;</span></button>
      <div class="ddm" id="exMenu"><button class="on">Binance<em>live</em></button><button disabled>OKX<em>soon</em></button><button disabled>Bybit<em>soon</em></button><button disabled>Aster<em>soon</em></button><button disabled>Bitget<em>soon</em></button><button disabled>Gate<em>soon</em></button><button disabled>MEXC<em>soon</em></button></div></div>
    <div class="dd" style="margin-left:auto"><button class="ddb tfb" id="tfBtn"><span id="tfTxt">4h</span> <span>&#9662;</span></button>
      <div class="ddm r" id="tfMenu"><button class="tf" data-i="15m">15 minutes</button><button class="tf" data-i="1h">1 hour</button><button class="tf on" data-i="4h">4 hours</button><button class="tf" data-i="1d">1 day</button><button class="tf" data-i="1w">1 week</button></div></div>
  </div>
  <div id="vChart" class="view" style="display:flex">
  <div class="info"><b id="px">--</b><span id="chg" class="mut"></span><span class="live" id="live"><i></i><span id="liveT">connecting</span></span></div>
  <div class="leg"><span><i style="background:#f5a524"></i>MA 50</span><span><i style="background:#5b8def"></i>MA 200</span></div>
  <div id="main"><div id="cMain"></div><div class="msg" id="msg">Loading chart…</div></div>
  <div id="rsiWrap"><span class="lbl">RSI 14</span><div class="c" id="cRsi"></div></div>
  </div>
  <div id="vWatch" class="view pg" style="display:none">
    <div class="pgh">Watchlist</div>
    <div id="wlist"></div>
  </div>
  <div id="vSet" class="view pg" style="display:none">
    <div class="pgh">Settings</div>
    <div class="grp">Chart</div>
    <label class="set"><span>Moving average 50</span><input type="checkbox" data-k="ma50"></label>
    <label class="set"><span>Moving average 200</span><input type="checkbox" data-k="ma200"></label>
    <label class="set"><span>Support &amp; resistance lines</span><input type="checkbox" data-k="levels"></label>
    <label class="set"><span>RSI 14 panel</span><input type="checkbox" data-k="rsi"></label>
    <div class="set"><span>Default timeframe</span><select id="setTf"><option value="15m">15 minutes</option><option value="1h">1 hour</option><option value="4h">4 hours</option><option value="1d">1 day</option><option value="1w">1 week</option></select></div>
    <div class="grp">Info</div>
    <div class="set"><span>Prices</span><b>USD (USDT)</b></div>
    <div class="set"><span>Times shown in</span><b id="tz"></b></div>
    <div class="set"><span>Live data</span><b>Binance</b></div>
  </div>
  <nav class="tabbar">
    <button class="tb on" data-v="vChart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4v16M7 8H4v7h3M17 4v16M17 6h-3v8h3"/></svg><span>Chart</span></button>
    <button class="tb" data-v="vWatch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>Watchlist</span></button>
    <button class="tb" data-v="vSet"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Settings</span></button>
  </nav>
</div>

<div id="sheetBg">
  <div class="sh-top"><button class="back" id="shBack" aria-label="Close"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3L5 9l6 6"/></svg></button><input id="shQ" placeholder="Search Binance pairs" autocomplete="off" autocapitalize="characters"></div>
  <div class="tabs"><button class="on">Crypto</button><button disabled style="opacity:.45">TradFi <sup style="font-size:9px">soon</sup></button></div>
  <div class="exs"><button class="on">Binance</button><button class="soon" disabled>OKX<sup>soon</sup></button><button class="soon" disabled>Bybit<sup>soon</sup></button><button class="soon" disabled>Aster<sup>soon</sup></button><button class="soon" disabled>Bitget<sup>soon</sup></button><button class="soon" disabled>Gate<sup>soon</sup></button><button class="soon" disabled>MEXC<sup>soon</sup></button></div>
  <div class="toolbar"><span id="pcount" style="color:var(--mut);font-size:13px"></span><button id="typeBtn" class="ddb" style="color:var(--txt)"><span id="typeTxt">all types</span> <span>&#9662;</span></button></div>
  <div id="plist"></div>
  <div id="typeBg" style="display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);align-items:flex-end"><div id="typeSheet" style="width:100%;background:#101a15;border-radius:18px 18px 0 0;padding:6px 8px 18px;border-top:1px solid var(--line)">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 12px;font-weight:800;font-size:16px">type<button id="typeX" class="back" style="width:30px;height:30px" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
    <div id="typeOpts"></div></div></div>
</div>
<script src="pcnchart.js"></script>
<script type="module">
import { SUPABASE_URL, SUPABASE_KEY } from './config.js';
const $ = id => document.getElementById(id);
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
$('tz').textContent = tz.replace('_', ' ');
const qs = new URLSearchParams(location.search);
let symbol = (qs.get('s') || 'BTC').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'BTC', interval = ['15m','1h','4h','1d','1w'].includes(qs.get('i')) ? qs.get('i') : '4h';
let meta = {};                       // symbol -> {name, img}
const sg = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } };
const ss = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
const fmt = n => n >= 100 ? n.toLocaleString('en-US', { maximumFractionDigits: 2 }) : n >= 1 ? n.toFixed(3) : n.toPrecision(4);
let lastPx = '', dayOpen = null, source = '', ws = null, wsTimer = 0, poll = 0, token = 0;
const TFN = { '15m': '15m', '1h': '1h', '4h': '4h', '1d': '1D', '1w': '1W' };
const syncTf = () => { document.querySelectorAll('#tfMenu .tf').forEach(b => b.classList.toggle('on', b.dataset.i === interval)); $('tfTxt').textContent = TFN[interval]; };
syncTf();

function fail(t) { const m = $('msg'); m.textContent = t; m.style.display = 'flex'; }
function setIco(el, sym) { const m = meta[sym]; if (m && m.img) { el.innerHTML = ''; const im = new Image(); im.src = m.img; im.alt = ''; im.style.cssText = 'width:100%;height:100%;border-radius:50%'; im.onerror = () => { el.textContent = sym[0]; }; el.appendChild(im); } else el.textContent = sym[0]; }
function setPair() { $('pTxt').textContent = symbol + '/USDT'; setIco($('pIco'), symbol); }
let prevP = null;
function flash(el, dir) { el.classList.remove('lf-u', 'lf-d'); void el.offsetWidth; el.classList.add(dir > 0 ? 'lf-u' : 'lf-d'); }
function setPrice(p) {
  lastPx = '$' + fmt(p); if (!$('px').classList.contains('hv')) { $('px').textContent = lastPx; if (prevP != null && p !== prevP) flash($('px'), p > prevP ? 1 : -1); }
  prevP = p;
  if (dayOpen) { const c = (p / dayOpen - 1) * 100; $('chg').textContent = (c >= 0 ? '+' : '') + c.toFixed(2) + '% today'; $('chg').style.color = c >= 0 ? '#16c784' : '#ea3943'; }
}
const chart = new window.PCNChart($('cMain'), $('cRsi'), { tz, onHover: c => {
  if (c) { $('px').classList.add('hv'); $('px').textContent = 'O ' + fmt(c.o) + ' H ' + fmt(c.h) + ' L ' + fmt(c.l) + ' C ' + fmt(c.c); }
  else if (lastPx) { $('px').classList.remove('hv'); $('px').textContent = lastPx; } } });

// ---------- live price ----------
function liveState(on, txt) { $('live').classList.toggle('on', on); $('liveT').textContent = txt; }
function stopLive() { clearTimeout(wsTimer); clearInterval(poll); poll = 0; if (ws) { ws.onclose = ws.onmessage = ws.onerror = null; try { ws.close(); } catch (_) {} ws = null; } }
function startLive(my, tries = 0) {
  stopLive();
  if (source !== 'binance') return startPoll(my);          // other sources: refresh by polling
  let opened = false;
  try { ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}usdt@kline_${interval}`); } catch (_) { return startPoll(my); }
  const guard = setTimeout(() => { if (!opened && my === token) { stopLive(); startPoll(my); } }, 6000);
  ws.onopen = () => { opened = true; clearTimeout(guard); liveState(true, 'live'); };
  ws.onmessage = ev => { try { const k = JSON.parse(ev.data).k; if (!k) return; chart.tick({ t: k.t, o: +k.o, h: +k.h, l: +k.l, c: +k.c, v: +k.v }); setPrice(+k.c); } catch (_) {} };
  ws.onclose = () => { clearTimeout(guard); if (my !== token) return; liveState(false, 'reconnecting'); wsTimer = setTimeout(() => startLive(my, tries + 1), Math.min(15000, 1500 * (tries + 1))); };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
}
function startPoll(my) {
  liveState(true, 'live');
  poll = setInterval(async () => {
    if (document.hidden || my !== token) return;
    try { const r = await fetch(`${SUPABASE_URL}/functions/v1/pcn-chart?symbol=${symbol}&interval=${interval}&limit=60&tz=${encodeURIComponent(tz)}`); const d = await r.json();
      if (my !== token || !d.candles) return; d.candles.slice(-2).forEach(k => chart.tick(k)); setPrice(d.analysis.price); } catch (_) { liveState(false, 'offline'); }
  }, 12000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && source === 'binance' && !ws && !poll) startLive(token); });

// ---------- load ----------
async function load() {
  const my = ++token; stopLive(); liveState(false, 'connecting'); fail('Loading chart…'); setPair();
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/pcn-chart?symbol=${symbol}&interval=${interval}&limit=500&tz=${encodeURIComponent(tz)}`);
    const d = await r.json();
    if (my !== token) return;
    if (!r.ok || d.error) throw new Error(d.error || r.status);
    chart.setData({ candles: d.candles, sma50: d.series.sma50, sma200: d.series.sma200, rsi14: d.series.rsi14, levels: (d.analysis.levels || []) }, interval);
    source = d.source; dayOpen = d.analysis.today ? d.analysis.today.open : null;
    $('px').classList.remove('hv'); setPrice(d.analysis.price);
    $('msg').style.display = 'none';
    startLive(my);
  } catch (e) { if (my === token) fail('Could not load ' + symbol + '/USDT. Pick another pair and try again.'); }
}
const menus = ['exMenu', 'tfMenu'];
const closeMenus = () => menus.forEach(m => $(m).classList.remove('on'));
$('exBtn').onclick = e => { e.stopPropagation(); const o = $('exMenu').classList.contains('on'); closeMenus(); if (!o) $('exMenu').classList.add('on'); };
$('tfBtn').onclick = e => { e.stopPropagation(); const o = $('tfMenu').classList.contains('on'); closeMenus(); if (!o) $('tfMenu').classList.add('on'); };
document.addEventListener('click', closeMenus);
document.querySelectorAll('#tfMenu .tf').forEach(b => b.onclick = () => { interval = b.dataset.i; syncTf(); closeMenus(); history.replaceState(null, '', `?s=${symbol}&i=${interval}`); load(); });

// ---------- pair picker (Binance live; other exchanges shown as coming soon) ----------
let pairs = null, favs = sg('pcn_chart_favs', []);
async function loadPairs() {
  if (pairs) return pairs;
  let rows = [];
  try { const r = await fetch(`${SUPABASE_URL}/rest/v1/coins?select=symbol,name,image_url,market_cap_rank&market_cap_rank=not.is.null&order=market_cap_rank.asc&limit=500`, { headers: { apikey: SUPABASE_KEY } }); rows = await r.json(); } catch (_) {}
  let ok = null;
  try { const cached = sg('pcn_binance_usdt', null); if (cached && Date.now() - cached.t < 6 * 36e5) ok = new Set(cached.s); else { const r = await fetch('https://api.binance.com/api/v3/ticker/price'); const a = await r.json(); ok = new Set(a.filter(x => x.symbol.endsWith('USDT')).map(x => x.symbol.slice(0, -4))); ss('pcn_binance_usdt', { t: Date.now(), s: [...ok] }); } } catch (_) {}
  const seen = new Set(); pairs = [];
  (Array.isArray(rows) ? rows : []).forEach(c => { const s = String(c.symbol || '').toUpperCase(); if (!s || seen.has(s) || (ok && !ok.has(s))) return; seen.add(s); pairs.push({ s, name: c.name || s, img: c.image_url }); meta[s] = { name: c.name, img: c.image_url }; });
  if (!seen.has('BTC')) pairs.unshift({ s: 'BTC', name: 'Bitcoin' });
  return pairs;
}
let ptype = 'all';
function renderTypes() {
  const n = (pairs || []).length, o = [['all', 'all types', n], ['spot', 'spot', n], ['perps', 'perps', 0], ['futures', 'futures', 0], ['options', 'options', 0]];
  $('typeOpts').innerHTML = '';
  o.forEach(([k, t, c]) => { const d = document.createElement('div'); d.className = 'topt' + (ptype === k ? ' on' : '') + (c ? '' : ' off'); d.innerHTML = `<span>${t}</span><em>${c || 'soon'}</em>`; if (c) d.onclick = () => { ptype = k; $('typeTxt').textContent = t; $('typeBg').style.display = 'none'; renderList(); }; $('typeOpts').appendChild(d); });
}
$('typeBtn').onclick = () => { renderTypes(); $('typeBg').style.display = 'flex'; };
$('typeX').onclick = () => { $('typeBg').style.display = 'none'; };
$('typeBg').onclick = e => { if (e.target.id === 'typeBg') $('typeBg').style.display = 'none'; };
function renderList() {
  $('pcount').textContent = pairs ? pairs.length + ' pairs' : '';
  const q = $('shQ').value.trim().toUpperCase(), box = $('plist');
  let a = (pairs || []).filter(p => !q || p.s.includes(q) || p.name.toUpperCase().includes(q));
  a = [...a.filter(p => favs.includes(p.s)), ...a.filter(p => !favs.includes(p.s))].slice(0, 120);
  box.innerHTML = a.length ? '' : '<div class="empty">No pair found on Binance.</div>';
  a.forEach(p => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<span class="st${favs.includes(p.s) ? ' on' : ''}">${favs.includes(p.s) ? '&#9733;' : '&#9734;'}</span><span class="ico"></span><span class="nm">${p.s}/USDT<small>${p.name.replace(/</g, '')}</small></span><span class="tp">spot</span>`;
    setIco(r.querySelector('.ico'), p.s);
    r.querySelector('.st').onclick = e => { e.stopPropagation(); favs = favs.includes(p.s) ? favs.filter(x => x !== p.s) : [p.s, ...favs]; ss('pcn_chart_favs', favs); renderList(); };
    r.onclick = () => { symbol = p.s; closeSheet(); history.replaceState(null, '', `?s=${symbol}&i=${interval}`); load(); };
    box.appendChild(r);
  });
}
function closeSheet() { $('sheetBg').classList.remove('on'); }
$('pairBtn').onclick = async () => { $('sheetBg').classList.add('on'); $('plist').innerHTML = '<div class="empty">Loading pairs…</div>'; await loadPairs(); renderList(); };
$('shBack').onclick = closeSheet; $('shQ').oninput = renderList;


// ---------- footer: Chart / Watchlist / Settings ----------
const DEF = { ma50: true, ma200: true, levels: true, rsi: true, tf: '4h' };
let SET = Object.assign({}, DEF, sg('pcn_chart_set', {}));
function applySet() {
  chart.setShow({ ma50: SET.ma50, ma200: SET.ma200, levels: SET.levels });
  $('rsiWrap').style.display = SET.rsi ? '' : 'none';
  const leg = document.querySelectorAll('.leg')[1]; if (leg) { const sp = leg.querySelectorAll('span'); sp[0].style.display = SET.ma50 ? '' : 'none'; sp[1].style.display = SET.ma200 ? '' : 'none'; }
  requestAnimationFrame(() => chart.resize());
}
document.querySelectorAll('#vSet input[data-k]').forEach(i => { i.checked = !!SET[i.dataset.k]; i.onchange = () => { SET[i.dataset.k] = i.checked; ss('pcn_chart_set', SET); applySet(); }; });
$('setTf').value = SET.tf; $('setTf').onchange = e => { SET.tf = e.target.value; ss('pcn_chart_set', SET); };
if (!qs.get('i') && SET.tf !== interval) { interval = SET.tf; syncTf(); load(); }
applySet();

let wlTimer = 0;
function showView(v) {
  document.querySelectorAll('.view').forEach(x => x.style.display = x.id === v ? 'flex' : 'none');
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelector('.top').style.display = v === 'vChart' ? '' : 'none';
  clearInterval(wlTimer); wlTimer = 0;
  if (v === 'vChart') requestAnimationFrame(() => chart.resize());
  if (v === 'vWatch') { renderWatch(); wlTimer = setInterval(renderWatch, 8000); }
}
document.querySelectorAll('.tb').forEach(b => b.onclick = () => showView(b.dataset.v));
const wprev = {};
async function renderWatch() {
  const box = $('wlist'); favs = sg('pcn_chart_favs', []);
  if (!favs.length) { box.innerHTML = '<div class="empty">Your watchlist is empty.<br>Tap the star next to a pair in the pair list to add it here.</div><button class="addb" id="wAdd">Add pairs</button>'; $('wAdd').onclick = () => { showView('vChart'); $('pairBtn').click(); }; return; }
  let tk = {};
  try { const r = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(favs.map(s => s + 'USDT')))); (await r.json()).forEach(t => tk[t.symbol] = t); } catch (_) {}
  if (!$('vWatch') || $('vWatch').style.display === 'none') return;
  box.innerHTML = '';
  favs.forEach(sym => {
    const t = tk[sym + 'USDT'], p = t ? +t.lastPrice : null, c = t ? +t.priceChangePercent : null;
    const row = document.createElement('div'); row.className = 'wrow';
    row.innerHTML = `<span class="ico"></span><span class="nm">${sym}/USDT<small>${(meta[sym] && meta[sym].name || '').replace(/</g, '')}</small></span><span class="pr"><span class="p">${p == null ? '--' : '$' + fmt(p)}</span><small style="color:${c == null ? 'var(--mut)' : c >= 0 ? '#16c784' : '#ea3943'}">${c == null ? '' : (c >= 0 ? '+' : '') + c.toFixed(2) + '%'}</small></span>`;
    setIco(row.querySelector('.ico'), sym);
    if (p != null && wprev[sym] != null && p !== wprev[sym]) flash(row.querySelector('.p'), p > wprev[sym] ? 1 : -1);
    if (p != null) wprev[sym] = p;
    row.onclick = () => { symbol = sym; history.replaceState(null, '', `?s=${symbol}&i=${interval}`); showView('vChart'); load(); };
    box.appendChild(row);
  });
  const add = document.createElement('button'); add.className = 'addb'; add.textContent = 'Add pairs'; add.onclick = () => { showView('vChart'); $('pairBtn').click(); }; box.appendChild(add);
}

setPair(); load();
loadPairs().then(setPair);
</script>
