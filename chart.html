    const r = await fetch(SUPABASE_URL + '/rest/v1/price_alerts', { method: 'POST', headers: { ...H, Prefer: 'return=minimal' }, body: JSON.stringify({ user_id: uid, coin_id: al.coin_id, target_price: al.target, currency: al.currency, direction: al.direction }) });
    if (!r.ok) {
      let e = {}; try { e = await r.json(); } catch (_) {}
      const m = (e.message || '') + ' ' + (e.details || '');
      if (/limit/i.test(m)) return { ok: false, msg: 'You have reached your limit of coin price alerts. Cancel one in the Alerts tab, then ask me again.' };
      if (e.code === '42501' || r.status === 401 || r.status === 403) return { ok: false, msg: 'Alerts are not allowed on this account right now. Check that notifications are on and your email is confirmed, then try again.' };
      return { ok: false, msg: 'Could not save the alert. Please try again.' };
    }
    let n = 0, lim = 20;
    try { const c = await fetch(SUPABASE_URL + '/rest/v1/price_alerts?select=id&status=eq.active', { headers: H }); const a = await c.json(); if (Array.isArray(a)) n = a.length; } catch (_) {}
    try { const b = await fetch(SUPABASE_URL + '/rest/v1/rpc/my_alert_bonus', { method: 'POST', headers: H, body: '{}' }); const v = await b.json(); if (typeof v === 'number' && v > 0) lim += v; } catch (_) {}
    return { ok: true, n, lim };
  } catch (_) { return { ok: false, msg: 'No connection. Please check your network and try again.' }; }
}
function showAlert(j, host, q) {
  const sym = j.alert && j.alert.currency === 'ngn' ? '₦' : '$';
  const logo = (j.alert && j.alert.image) || (j.suggest && j.suggest.image) || '';
  host.innerHTML = cardHtml(j.text || '', logo);
  const row = document.createElement('div'); row.className = 'ag-btns'; host.querySelector('.ag-card').appendChild(row);
  const btn = (label, cls, fn, img) => { const b = document.createElement('button'); b.type = 'button'; if (img) b.innerHTML = logoHtml(img); b.appendChild(document.createTextNode(label)); if (cls) b.className = cls; b.onclick = async () => { row.querySelectorAll('button').forEach(x => x.disabled = true); await fn(); }; row.appendChild(b); };
  const finish = () => { saveTurn(q, host.parentNode.innerHTML); msgsEl.scrollTop = msgsEl.scrollHeight; };
  const again = async body => { const r = await alertCall({ alert: body }); if (r && r.intent === 'alert') showAlert(r, host, q); else { host.innerHTML = cardHtml('Sorry, I could not check that alert. Please try again.'); finish(); } };
  if ((j.status === 'confirm' || j.status === 'flip') && j.alert) {
    const al = j.alert;
    btn(j.status === 'flip' ? 'Yes, set it' : 'Confirm', 'pri', async () => {
      const r = await saveAlert(al);
      if (!r.ok) host.innerHTML = cardHtml(r.msg);
      else { host.innerHTML = cardHtml('Alert set ✅\n' + al.name + ' (' + al.symbol + ') ' + al.direction + ' ' + sym + Number(al.target).toLocaleString('en-US', { maximumFractionDigits: 8 }) + '\n' + r.n + ' of ' + r.lim + ' coin price alerts used.', al.image); host.querySelector('.ag-card').insertAdjacentHTML('beforeend', '<div class="ag-btns"><a href="index.html#alerts">View my alerts</a></div>'); }
      finish();
    });
    btn('Cancel', '', async () => { host.innerHTML = cardHtml('Okay, I did not set the alert.'); finish(); });
  } else if (j.status === 'nonsense' && j.suggest) {
    const sg = j.suggest; btn('Yes, ' + sg.label, 'pri', () => again({ coin: sg.coin_id, dir: null, target: sg.target, cur: sg.currency }));
    btn('No', '', async () => { host.innerHTML = cardHtml('Okay. Tell me the price you want.'); finish(); });
  } else if (j.status === 'pick' && j.options) {
    j.options.forEach(o => btn(o.name + ' (' + o.symbol + ')' + (o.rank ? ' · #' + o.rank : ''), '', () => again({ coin: o.id, dir: j.dir, target: j.target, cur: j.cur }), o.image));
  } else { row.remove(); finish(); }
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
async function ask(q) {
  q = (q || '').trim(); if (q.length < 2 || busy) return;
  busy = true; $('agSend').disabled = true;
  if (!agent.classList.contains('open')) setOpen(true);
  if (msgsEl.querySelector('.ag-sug') || msgsEl.querySelector('.hv-top')) msgsEl.innerHTML = '';
  msgsEl.insertAdjacentHTML('beforeend', '<div class="ag-u">' + esc(q) + '</div>');
  const a = document.createElement('div'); a.className = 'ag-a'; msgsEl.appendChild(a); const box = mkSteps(a);
  agIn.value = ''; agIn.style.height = 'auto'; msgsEl.scrollTop = msgsEl.scrollHeight;
  const act = await chartAction(q, box);
  let aiRow = null, tAi0 = 0;
  const done = html => { if (aiRow) aiRow.done(ms1(tAi0)); box.end(); a.insertAdjacentHTML('beforeend', html); msgsEl.scrollTop = msgsEl.scrollHeight; busy = false; $('agSend').disabled = false; };
  if (act) { box.extra('free'); done(act); saveTurn(q, a.innerHTML); return; }
  if (ALERT_RE.test(q) && getToken()) {
    const t0 = performance.now(), arow = box.add('pulse', 'alert_check', 'running', 'checking if you want to set an alert', true), aj = await alertCall({ question: q });
    arow.done(ms1(t0));
    if (aj && aj.intent === 'alert') { box.end(); const host = document.createElement('div'); a.appendChild(host); showAlert(aj, host, q); busy = false; $('agSend').disabled = false; return; }
  }
  await stg(box, 'eye', 'read_chart', 'read the current view and drawings', () => chart.count(), n => n + ' drawing' + (n === 1 ? '' : 's'), null, 300);
  await stg(box, 'eye', 'read_data', 'loaded the requested history', () => lastD ? lastD.candles.length : 0, n => n + ' candles', null, 300);
  const ctxText = await stg(box, 'pulse', 'analyze', 'analyzed swings, trend, levels and volatility', () => { if (chart.scan) chart.scan(1100); return chartContext(q); }, () => 'levels, trend, RSI', null, 1100);
  tAi0 = performance.now(); aiRow = box.add('chat', 'ask_ai', 'running', 'writing the answer from the chart numbers (' + MN[agMode] + ')', true);
  const tok = getToken();
  if (!tok) return done('<p>Please <a href="index.html#account" style="color:#16c784;font-weight:700">sign in with Google</a> to ask questions. It is free.</p>');
  try {
    const r = await fetch(SUPABASE_URL + '/functions/v1/pcn-chat2', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + tok }, body: JSON.stringify({ question: q, mode: agMode, chart: ctxText }) });
    let j = {}; try { j = await r.json(); } catch (_) {}
    if (r.status === 401) return done('<p>Your sign-in has expired. Please sign in again.</p>');
    if (r.status === 429) return done('<p>You have used your ' + (j.limit || '') + ' ' + MN[agMode] + ' questions for today. They reset at 1:00 AM Nigeria time. You can switch mode below.</p>');
    if (!r.ok || !j.answer) return done('<p>PCN AI could not answer right now. Please try again in a moment.</p>');
    let ans = String(j.answer).replace(/\n+\s*Sources:[\s\S]*$/, '').replace(/\(?https?:\/\/[^\s<)]+\)?/g, '').replace(/\[([^\]]+)\]\(\)/g, '$1').trim().replace(/^\s*(Upside case|Downside case|What changes the read)\s*:/gmi, '**$1:**');
    const outHtml = md(ans) + '<div class="ag-note">' + (j.left != null ? j.left + ' ' + MN[agMode] + ' question' + (j.left === 1 ? '' : 's') + ' left today. ' : '') + 'AI answers can be wrong. Not financial advice.</div>'; if (j.left != null) box.extra(j.left + ' ' + MN[agMode] + ' left'); done(outHtml); saveTurn(q, a.innerHTML);
  } catch (err) { console.warn('pcn agent', err); done('<p>No connection. Please check your network and try again.</p>'); }
}
$('agForm').addEventListener('submit', e => { e.preventDefault(); ask(agIn.value); });

setPair(); load();
loadPairs().then(setPair);
