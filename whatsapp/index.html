
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceCheck NG WhatsApp Bot</title>
  <meta name="robots" content="noindex">

  <script>
    const phone = "2347084272516";
    const message = "Hi, I want to check crypto prices and exchange rates.";

    const whatsappLink =
      "https://api.whatsapp.com/send?phone=" +
      phone +
      "&text=" +
      encodeURIComponent(message);

    window.location.replace(whatsappLink);
  </script>
</head>
<body>
  <p>Opening PriceCheck NG WhatsApp Bot...</p>
  <a href="https://api.whatsapp.com/send?phone=2347084272516&text=Hi%2C%20I%20want%20to%20check%20crypto%20prices%20and%20exchange%20rates.">
    Open WhatsApp Bot
  </a>
</body>
</html>
