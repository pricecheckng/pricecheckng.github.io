<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Live crypto prices widget | PriceCheck NG</title>
<style>
:root{--bg:#fff;--ink:#0f1a14;--mu:#5d6b64;--line:#e3e8e5;--up:#16a34a;--dn:#dc2626;--hd:#0a7a3a}
body.dark{--bg:#0e1511;--ink:#e9f1ec;--mu:#9db0a5;--line:#26332c;--up:#34d399;--dn:#f87171}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{background:transparent;color:var(--ink);font:14px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
.w{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.h{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--hd);color:#fff;font-weight:800;font-size:.85rem}
.h i{font-style:normal;font-weight:600;font-size:.72rem;opacity:.9}
.r{display:flex;align-items:center;gap:10px;padding:0 12px;height:44px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.r:first-of-type{border-top:0}
.r img{width:26px;height:26px;border-radius:50%;flex:none;background:var(--line)}
.r b{font-size:.95rem}.r small{display:block;color:var(--mu);font-size:.72rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.n{flex:1;min-width:0}.p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.c{font-size:.78rem;font-weight:700;min-width:58px;text-align:right}.c.u{color:var(--up)}.c.d{color:var(--dn)}
.f{display:block;text-align:center;padding:7px;border-top:1px solid var(--line);font-size:.72rem;color:var(--mu);text-decoration:none}.f b{color:var(--hd)}body.dark .f b{color:var(--up)}
.e{padding:18px;text-align:center;color:var(--mu)}
</style></head><body>
<div class="w" id="w"><div class="h"><span>PriceCheck NG</span><i id="cur"></i></div><div id="rows"><div class="e">Loading prices…</div></div><a class="f" id="ft" href="https://pricecheckng.com.ng/" target="_blank" rel="noopener">Live prices by <b>PriceCheck NG</b></a></div>
<script type="module">
import { SUPABASE_URL, SUPABASE_KEY } from "/config.js";
const q = new URLSearchParams(location.search);
const ids = (q.get("coins") || "bitcoin,ethereum,solana").toLowerCase().split(",").map((s) => s.trim().replace(/[^a-z0-9._-]/g, "")).filter(Boolean).slice(0, 10);
const CUR = {"USD":["🇺🇸","$","United States dollar"],"NGN":["🇳🇬","₦","Nigerian naira"],"GBP":["🇬🇧","£","British pound"],"EUR":["🇪🇺","€","Euro"],"GHS":["🇬🇭","GH₵","Ghanaian cedi"],"ZAR":["🇿🇦","R","South African rand"],"CAD":["🇨🇦","CA$","Canadian dollar"],"AUD":["🇦🇺","A$","Australian dollar"],"AED":["🇦🇪","AED ","UAE dirham"],"CNY":["🇨🇳","CN¥","Chinese yuan"],"KES":["🇰🇪","KSh ","Kenyan shilling"],"TZS":["🇹🇿","TSh ","Tanzanian shilling"],"UGX":["🇺🇬","USh ","Ugandan shilling"],"INR":["🇮🇳","₹","Indian rupee"],"JPY":["🇯🇵","¥","Japanese yen"],"BRL":["🇧🇷","R$","Brazilian real"],"CHF":["🇨🇭","CHF ","Swiss franc"],"CLP":["🇨🇱","CLP$","Chilean peso"],"CZK":["🇨🇿","Kč ","Czech koruna"],"DKK":["🇩🇰","kr ","Danish krone"],"HKD":["🇭🇰","HK$","Hong Kong dollar"],"HUF":["🇭🇺","Ft ","Hungarian forint"],"IDR":["🇮🇩","Rp ","Indonesian rupiah"],"ILS":["🇮🇱","₪","Israeli new shekel"],"KRW":["🇰🇷","₩","South Korean won"],"MXN":["🇲🇽","MX$","Mexican peso"],"MYR":["🇲🇾","RM ","Malaysian ringgit"],"NOK":["🇳🇴","kr ","Norwegian krone"],"NZD":["🇳🇿","NZ$","New Zealand dollar"],"PHP":["🇵🇭","₱","Philippine peso"],"PKR":["🇵🇰","₨ ","Pakistani rupee"],"PLN":["🇵🇱","zł ","Polish złoty"],"RUB":["🇷🇺","₽","Russian ruble"],"SEK":["🇸🇪","kr ","Swedish krona"],"SGD":["🇸🇬","S$","Singapore dollar"],"THB":["🇹🇭","฿","Thai baht"],"TRY":["🇹🇷","₺","Turkish lira"],"TWD":["🇹🇼","NT$","New Taiwan dollar"],"VND":["🇻🇳","₫","Vietnamese dong"],"MAD":["🇲🇦","MAD ","Moroccan dirham"],"IRR":["🇮🇷","IRR ","Iranian rial"],"ARS":["🇦🇷","ARS$","Argentine peso"],"RON":["🇷🇴","RON ","Romanian leu"],"UAH":["🇺🇦","₴","Ukrainian hryvnia"],"COP":["🇨🇴","COP$","Colombian peso"],"EGP":["🇪🇬","E£","Egyptian pound"],"SAR":["🇸🇦","SAR ","Saudi riyal"],"BDT":["🇧🇩","৳","Bangladeshi taka"],"BGN":["🇧🇬","лв ","Bulgarian lev"],"VES":["🇻🇪","Bs. ","Venezuelan bolívar"]};
const cur = CUR[(q.get("cur") || "usd").toUpperCase()] ? (q.get("cur") || "usd").toUpperCase() : "USD";
let fx = {};
const th = q.get("theme") || "light";
if (th === "dark" || (th === "auto" && matchMedia("(prefers-color-scheme:dark)").matches)) document.body.classList.add("dark");
document.getElementById("cur").textContent = "Prices in " + cur;
const H = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmt(v) {
  v = Number(v); if (!(v > 0)) return "–";
  const sym = CUR[cur][1];
  const d = v >= 1000 ? 0 : v >= 1 ? 2 : v >= 0.01 ? 4 : 6;
  return sym + v.toLocaleString("en-US", { minimumFractionDigits: v >= 1 && v < 1000 ? 2 : 0, maximumFractionDigits: d });
}
async function load() {
  try {
    if (cur !== "USD" && !fx[cur]) { const f = await (await fetch(SUPABASE_URL + "/rest/v1/fx_rates?select=currency,per_usd&currency=eq." + cur, { headers: H })).json(); if (f && f[0]) fx[cur] = Number(f[0].per_usd); }
    const r = await fetch(SUPABASE_URL + "/rest/v1/coins?select=id,symbol,name,image_url,price_usd,price_ngn,change_24h_pct&id=in.(" + ids.map(encodeURIComponent).join(",") + ")", { headers: H });
    const rows = await r.json();
    const by = {}; rows.forEach((c) => (by[c.id] = c));
    document.getElementById("rows").innerHTML = ids.filter((i) => by[i]).map((i) => {
      const c = by[i], ch = Number(c.change_24h_pct), px = cur === "USD" ? c.price_usd : cur === "NGN" && c.price_ngn != null ? c.price_ngn : fx[cur] ? Number(c.price_usd) * fx[cur] : null;
      return '<a class="r" target="_blank" rel="noopener" href="https://pricecheckng.com.ng/' + encodeURIComponent(c.id) + '-price.html?utm_source=widget&utm_medium=embed"><img alt="" src="' + esc(c.image_url) + '"><span class="n"><b>' + esc(String(c.symbol).toUpperCase()) + "</b><small>" + esc(c.name) + '</small></span><span class="p">' + fmt(px) + '</span><span class="c ' + (ch >= 0 ? "u" : "d") + '">' + (isFinite(ch) ? (ch >= 0 ? "+" : "") + ch.toFixed(2) + "%" : "–") + "</span></a>";
    }).join("") || '<div class="e">No coins found</div>';
  } catch (e) { document.getElementById("rows").innerHTML = '<div class="e">Prices unavailable</div>'; }
}
const post = () => { try { parent.postMessage({ pcnH: document.getElementById("w").offsetHeight + 2 }, "*"); } catch (e) {} };
load().then(post); setInterval(() => load().then(post), 30000);
</body></html>
